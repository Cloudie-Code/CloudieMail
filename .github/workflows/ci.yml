name: Linux build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgtk-4-dev libssl-dev libcurl4-openssl-dev libsodium-dev nlohmann-json3-dev libtool-bin unzip
          echo '127.0.0.1 localhost.localdomain' | sudo tee -a /etc/hosts
          echo '::1 localhost.localdomain' | sudo tee -a /etc/hosts
      - name: Prepare Firebird
        run: bash scripts/bootstrap-linux.sh
      - name: Compile and test
        run: bash scripts/build-linux.sh
      - name: Test MIME parser
        run: node tests/mime_test.js
      - name: Test release manifest checks
        run: python3 tests/release_test.py
